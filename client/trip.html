<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Details</title>

    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="shared-header">
      <nav class="shared-nav">
        <h1>Travel Tracker</h1>

        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="create.html">Create Trip</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Trip Details</h2>
        <div id="trip-details"></div>
      </section>

      <section>
        <h2>Schedule</h2>

        <form id="schedule-form">
          <input type="text" id="activity" placeholder="Activity" />
          <input type="date" id="day" />

          <button type="submit">Add</button>
          <button type="reset">Reset</button>
        </form>

        <table id="schedule-table">
          <thead>
            <tr>
              <th>Day</th>
              <th>Activity</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="schedule-body"></tbody>
        </table>
      </section>

      <aside>
        <h2>Weather</h2>

        <div id="weather"></div>
      </aside>
    </main>

    <footer>
      <p>Snow College || Travel Tracker</p>
    </footer>

    <script type="module" src="src/ui/trip-ui.js"></script>
  </body>
</html>
