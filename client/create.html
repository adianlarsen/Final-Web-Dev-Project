<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Create Trip</title>

        <script src="./src/ui/create-ui.js" type="module"></script>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    </head>

    <body>
        <header class="shared-header">
            <nav class="shared-nav">
                <h1>Travel Tracker</h1>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="create.html">Create Trip</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section>
                <h2>Create a Trip</h2>

                <form id="trip-form">
                    <label for="trip-name">Country</label>
                    <input id="trip-name" type="text">

                    <label for="destination">Destination City</label>
                    <input id="destination" type="text">

                    <label for="start-date">Start Date</label>
                    <input id="start-date" type="date">

                    <label for="end-date">End Date</label>
                    <input id="end-date" type="date">

                    <label for="budget">Budget</label>
                    <input id="budget" type="number">

                    <label for="status">Status</label>
                    <select id="status">
                        <option value="upcoming">Upcoming</option>
                        <option value="current">Current</option>
                        <option value="completed">Completed</option>
                    </select>

                    <button type="submit">Create Trip</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Snow College || Travel Tracker</p>
        </footer>

        <script type="module" src="src/ui/create-ui.js"></script>
    </body>
</html>
